# Built-in defaults. Do NOT edit this file to configure an instance.
#
# Instance hosts override these in an external config.yml — see config.example.yml in the repository root.
# Every location below is searched; each one that exists is applied, and later entries win over earlier ones,
# so TDT_CONFIG_FILE (when set) always has the final say. The startup log reports which files were used.
spring:
  config:
    import:
      - "optional:file:./config.yml"                        # next to the working directory (jar, bootRun)
      - "optional:file:./config/config.yml"                 # a config/ folder next to the working directory
      - "optional:file:/tdt-data/config.yml"                # the Docker data volume (legacy location)
      - "optional:file:/config/config.yml"                  # dedicated config mount - what docker-compose.yml uses
      - "optional:file:${TDT_CONFIG_FILE:/config/config.yml}"    # explicit override, highest precedence

server:
  port: 8080
  compression:
    enabled: true

tdt:
  # ${storage.dir} / ${websocket.allowed-origins} keep the pre-config-file flags (--storage.dir=...) working
  storage-dir: ${storage.dir:.}
  websocket:
    allowed-origins: ${websocket.allowed-origins:http://localhost:8080}
    max-text-message-bytes: 3145728    # 3 MiB
    max-binary-message-bytes: 5242880  # 5 MiB
    keep-alive-interval-seconds: 15
  limits:
    max-players: 0                     # 0 = no server-wide cap
    max-chat-messages: 50
    max-chat-text-length: 200
    max-upload-bytes: 2097152          # 2 MiB
  public-games:
    enabled: true
