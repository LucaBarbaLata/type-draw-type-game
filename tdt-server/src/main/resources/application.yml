# Built-in defaults. Do NOT edit this file to configure an instance.
#
# Instance hosts override these in an external config.yml — see config.example.yml in the repository root.
# The file is looked up at ./config.yml (next to the working directory) unless TDT_CONFIG_FILE points elsewhere;
# the Docker image sets TDT_CONFIG_FILE=/tdt-data/config.yml.
spring:
  config:
    import: "optional:file:${TDT_CONFIG_FILE:./config.yml}"

server:
  port: 8080
  compression:
    enabled: true

tdt:
  # ${storage.dir} / ${websocket.allowed-origins} keep the pre-config-file flags (--storage.dir=...) working
  storage-dir: ${storage.dir:.}
  websocket:
    allowed-origins: ${websocket.allowed-origins:http://localhost:8080}
    max-text-message-bytes: 3145728    # 3 MiB
    max-binary-message-bytes: 5242880  # 5 MiB
    keep-alive-interval-seconds: 15
  limits:
    max-players: 0                     # 0 = no server-wide cap
    max-chat-messages: 50
    max-chat-text-length: 200
    max-upload-bytes: 2097152          # 2 MiB
  public-games:
    enabled: true
